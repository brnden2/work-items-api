<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Items Frontend</title>
</head>
<body>

    <h1>Work Items</h1>

    <h2>Create Work Item</h2>

    <form id="work-item-form">
        <div>
            <label for="title">Title:</label>
            <input
                type="text"
                id="title"
                name="title"
                required
                minlength="3"
                maxlength="100"
            >
        </div>

        <br>

        <div>
            <label for="status">Status:</label>

            <select id="status" name="status">
                <option value="open">Open</option>
                <option value="in_progress">In Progress</option>
                <option value="completed">Completed</option>
            </select>
        </div>

        <br>

        <button type="submit">Create Work Item</button>
    </form>

    <p id="message"></p>

    <hr>

    <h2>Find Work Items</h2>

<form id="filter-form">
    <label for="search-title">Search by title:</label>
    <input
        id="search-title"
        type="search"
        maxlength="100"
        placeholder="Enter part of a title"
    >

    <label for="filter-status">Status:</label>
    <select id="filter-status">
        <option value="">All statuses</option>
        <option value="open">Open</option>
        <option value="in_progress">In progress</option>
        <option value="completed">Completed</option>
    </select>

    <button type="submit">Apply filters</button>
    <button id="clear-filters" type="button">Clear filters</button>
</form>

<p id="filter-message" role="status" aria-live="polite"></p>

<button id="load-button" type="button">Refresh results</button>

    <ul id="work-items-list"></ul>

    <script src="script.js"></script>
</body>
</html>
