<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Items Frontend</title>
</head>
<body>

    <h1>Work Items</h1>

    <h2>Create Work Item</h2>

    <form id="work-item-form">
        <div>
            <label for="title">Title:</label>
            <input
                type="text"
                id="title"
                name="title"
                required
                minlength="3"
                maxlength="100"
            >
        </div>

        <br>

        <div>
            <label for="status">Status:</label>

            <select id="status" name="status">
                <option value="open">Open</option>
                <option value="in_progress">In Progress</option>
                <option value="completed">Completed</option>
            </select>
        </div>

        <br>

        <button id="create-button" type="submit">Create Work Item</button>
    </form>

   <p id="message" role="status" aria-live="polite"></p>

    <hr>

    <h2>Find Work Items</h2>

<form id="filter-form">
    <label for="search-title">Search by title:</label>
    <input
        id="search-title"
        type="search"
        maxlength="100"
        placeholder="Enter part of a title"
    >

    <label for="filter-status">Status:</label>
    <select id="filter-status">
        <option value="">All statuses</option>
        <option value="open">Open</option>
        <option value="in_progress">In progress</option>
        <option value="completed">Completed</option>
    </select>

    <button type="submit">Apply filters</button>
    <button id="clear-filters" type="button">Clear filters</button>
</form>

<p id="filter-message" role="status" aria-live="polite"></p>

<button id="load-button" type="button">Refresh results</button>

    <ul id="work-items-list"></ul>

    <nav aria-label="Work item pages">
        <button id="previous-page" type="button" disabled>
            Previous
        </button>

        <span id="page-label" role="status" aria-live="polite">
            Page 1
        </span>

        <button id="next-page" type="button" disabled>
            Next
        </button>
    </nav>

    <dialog id="edit-dialog" aria-labelledby="edit-heading">
    <h2 id="edit-heading">Edit work item</h2>
    <p>Update the title or status, then select Save changes.</p>

    <form id="edit-work-item-form">
        <div>
            <label for="edit-title">Title</label>
            <input
                id="edit-title"
                type="text"
                required
                minlength="3"
                maxlength="100"
            >
        </div>

        <div>
            <label for="edit-status">Status</label>
            <select id="edit-status">
                <option value="open">Open</option>
                <option value="in_progress">In progress</option>
                <option value="completed">Completed</option>
            </select>
        </div>

        <p id="edit-message" role="status" aria-live="polite"></p>

        <button id="edit-save-button" type="submit">
            Save changes
        </button>
        <button id="edit-cancel-button" type="button">
            Cancel
        </button>
    </form>
</dialog>

<dialog id="delete-dialog" aria-labelledby="delete-heading">
    <h2 id="delete-heading">Delete work item?</h2>

    <p>This permanently deletes the following work item:</p>
    <p id="delete-item-title"></p>
    <p>This action cannot be undone.</p>

    <p id="delete-message" role="status" aria-live="polite"></p>

    <button id="delete-cancel-button" type="button" autofocus>
        Keep work item
    </button>
    <button id="delete-confirm-button" type="button">
        Delete permanently
    </button>
</dialog>

    <script src="script.js"></script>
</body>
</html>
